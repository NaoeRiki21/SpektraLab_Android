name: Android APK (NDK C++20 + Vulkan + Compose MD3)

on:
  push:
    branches: [android]
  pull_request:
    branches: [android]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK (arm64-v8a & x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SPIR-V & Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build glslang-tools python3 curl ca-certificates

      - name: Cache LibRaw 0.22.2 & Vulkan-Headers
        uses: actions/cache@v4
        with:
          path: build/deps
          key: engine-deps-${{ runner.os }}-${{ hashFiles('engine/setup-deps.sh', 'engine/setup-libraw.sh') }}

      - name: Stage Engine Profiles, Constants, ICC & Compile 34 Vulkan Shaders (.spv)
        run: |
          chmod +x engine/setup-deps.sh engine/setup-libraw.sh engine/stage-android-assets.sh
          bash engine/stage-android-assets.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug & Release APKs
        run: |
          gradle -p android assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload SpektraLab Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
